# Runs every check (tests/run-all.sh) on each pull request and on main. A pull request is merged only when this
# is green and the real-phone checklist in the pull request is done.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the progress tests compare with the version that is live on main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: tests/run-all.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: tests/playwright-report
          retention-days: 7
