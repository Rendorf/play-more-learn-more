<!doctype html>
<!-- Shown for any address that doesn't exist. Without a 404.html, Cloudflare Pages treats the site as a single-page
     app and serves the game at every mistyped address. Links are absolute so it works on every host. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Play More Learn More</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #0b1026; color: #e8ecff; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; box-sizing: border-box; }
  main { max-width: 420px; }
  .big { font-size: 64px; line-height: 1; margin: 0 0 12px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #aab3d9; }
  a { display: block; margin: 0 0 12px; padding: 14px 20px; border-radius: 14px; font-weight: 700; text-decoration: none; }
  .play { background: #ffcf3f; color: #1a1300; }
  .how { background: #1c2550; color: #e8ecff; }
</style>
</head>
<body>
<main>
  <div class="big" aria-hidden="true">🧭</div>
  <h1>Page not found</h1>
  <p>This address doesn't lead anywhere. Try one of these:</p>
  <a class="play" href="https://play.pmlm.uk/">Play the game</a>
  <a class="how" href="https://pmlm.uk/">How it works</a>
</main>
</body>
</html>
